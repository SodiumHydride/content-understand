name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node deps
        run: npm ci --legacy-peer-deps

      - name: Install Python deps
        run: pip install -r requirements.txt pyinstaller

      - name: Build sidecar
        run: pyinstaller sidecar.spec --noconfirm --distpath sidecar-dist

      - name: Build Electron
        run: npx electron-vite build && npx electron-builder --${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: content-understand-${{ matrix.platform }}
          path: dist/*
          retention-days: 30
