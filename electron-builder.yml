appId: com.content-understand.app
productName: Content Understand
directories:
  output: dist
files:
  - out/**/*
extraResources:
  - from: sidecar-dist/sidecar/
    to: sidecar
    filter:
      - "**/*"
win:
  target: nsis
  icon: build/icon.ico
mac:
  target: dmg
  icon: build/icon.icns
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
