[project]
name = "content-understand"
version = "0.1.0"
description = "Multimodal content understanding engine"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "tenacity>=8.2.0",
    "huggingface_hub>=0.26.0",
    "psutil>=5.9.0",
    "yt-dlp>=2024.1.0",
    "trafilatura>=1.6",
    "pymupdf>=1.23",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module level import not at top (sys.path manipulation)
    "B008",   # do not perform function calls in argument defaults
    "RUF001", # ambiguous unicode chars (Chinese punctuation in prompts)
]

[tool.ruff.lint.isort]
known-first-party = ["content_understand", "engine"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
