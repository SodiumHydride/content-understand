[project]
name = "content-understand"
version = "0.1.0"
description = "Multimodal content understanding engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.130.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.5.0",
    "requests>=2.32.3",
    "tenacity>=9.0.0",
    "huggingface-hub>=1.0.0,<2",
    "psutil>=7.0.0",
    "zstandard>=0.23.0",
    "sse-starlette>=2.0.0",
    "janus>=2.0.0",
    "yt-dlp>=2026.1.0",
    "trafilatura>=2.0.0",
    "pymupdf>=1.26.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module level import not at top (sys.path manipulation)
    "B008",   # do not perform function calls in argument defaults
    "RUF001", # ambiguous unicode chars (Chinese punctuation in prompts)
]

[tool.ruff.lint.isort]
known-first-party = ["content_understand", "engine"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
